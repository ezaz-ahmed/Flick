services:
  postgres:
    image: postgres:17
    container_name: flick-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flick
      POSTGRES_PASSWORD: flick
      POSTGRES_DB: flick
    ports:
      - '5432:5432'
    volumes:
      - flick_postgres_data:/var/lib/postgresql/data

volumes:
  flick_postgres_data:
